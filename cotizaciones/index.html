<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ESOTERIC · Cotizaciones</title>
<style>
:root{--b:#315ddd;--b2:#4770e8;--bg:#f5f5fa;--t:#202431;--m:#7c8190}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial;color:var(--t)}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.app{min-height:100vh;padding-bottom:92px}.top{padding:24px 22px 8px;background:linear-gradient(145deg,#eaf0ff,#f8f8fc)}.brand{display:flex;align-items:center;gap:10px}.mark{width:39px;height:39px;border-radius:11px;background:linear-gradient(145deg,#2458cf,#4d72e9);display:grid;place-items:center;color:#fff;font-size:24px}.brand b{font-size:25px}.tools{margin-left:auto;display:flex;gap:10px}.round{width:43px;height:43px;border-radius:50%;background:#727887;color:#fff;font-size:21px}.month{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:22px;font-size:25px;font-weight:700}.calendar{background:#fff;border-radius:50%;width:48px;height:48px;display:grid;place-items:center}.summary{text-align:center;padding:46px 0 35px}.summary .label{font-size:25px}.amount{font-size:61px;letter-spacing:-3px;margin:12px 0 2px}.due{font-size:19px}.due span{color:#e44b4b;font-weight:600}.dots{text-align:center}.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#aaa;margin:4px}.dots i.active{background:#3970e8}.list{padding:0 22px}.card{background:#fff;border-radius:23px;padding:16px 15px;box-shadow:0 2px 9px #0001;margin-bottom:10px;display:flex;align-items:center;gap:14px}.doc{width:52px;height:52px;border-radius:50%;background:#eef0f7;display:grid;place-items:center;font-size:25px;color:#697185}.info{flex:1}.info b{font-size:19px}.info small{display:block;color:#8a8d98;font-size:15px;margin-top:3px}.money{text-align:right;font-size:18px}.badge{display:block;background:#fff1bc;color:#eda62b;border-radius:6px;padding:5px 8px;margin-top:5px;font-size:12px}.fab{position:fixed;bottom:77px;left:26px;right:26px;height:64px;border-radius:34px;background:linear-gradient(100deg,#2460d5,#4b6ee5);color:#fff;font-size:20px;box-shadow:0 7px 22px #315ddd55;z-index:5}.nav{position:fixed;bottom:0;left:0;right:0;height:76px;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #eee;z-index:6}.nav button{background:#fff;color:#8a8d94;font-size:11px}.nav button.active{color:#3264dc;font-weight:700}.nav span{display:block;font-size:23px;margin-bottom:3px}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:20;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;border-radius:25px 25px 0 0;width:100%;max-height:92vh;overflow:auto;padding:22px}.sheet h2{margin:0 0 4px;color:#28304a}.sheet p{color:#888}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.field label{font-size:12px;color:#666}.field input,.field textarea{width:100%;margin-top:5px;padding:11px;border:1px solid #ddd;border-radius:10px;background:#fafafa}.field textarea{min-height:70px}.items{margin-top:15px}.item{display:grid;grid-template-columns:1fr 65px 90px 35px;gap:6px;margin:7px 0}.item input{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px}.del{background:#ffe8e8;color:#d44;border-radius:8px}.add{background:#eef2ff;color:#315ddd;padding:9px 12px;border-radius:9px}.acts{display:flex;gap:8px;margin-top:16px}.acts button{flex:1;padding:13px;border-radius:11px}.cancel{background:#eee}.save{background:#315ddd;color:#fff}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:11px 17px;border-radius:20px;z-index:40;display:none}
@media(min-width:800px){body{display:flex;justify-content:center}.app{width:430px;box-shadow:0 0 50px #0001}.nav,.fab{max-width:430px;left:50%;transform:translateX(-50%)}.fab{width:378px}.modal .sheet{width:430px;margin:auto;border-radius:25px}}
</style></head><body><div class="app">
<header class="top"><div class="brand"><div class="mark">➤</div><b>ESOTERIC</b><div class="tools"><button class="round">⌕</button><button class="round">⚙</button></div></div><div class="month"><div class="calendar">▦</div><span id="month"></span></div><div class="summary"><div class="label">Total</div><div class="amount" id="grand">$0.00</div><div class="due">Total por pagar: <span id="due">$0.00</span></div></div><div class="dots"><i class="active"></i><i></i></div></header>
<main class="list" id="list"></main><button class="fab" onclick="openQ()">＋ &nbsp;CREAR COTIZACIÓN</button>
<nav class="nav"><button class="active"><span>▤</span>Cotizaciones</button><button><span>▱</span>Presupuestos</button><button><span>●</span>Clientes</button><button><span>▦</span>Herramientas</button><button><span>▥</span>Informes</button></nav></div>
<div class="modal" id="modal"><div class="sheet"><h2>Crear cotización</h2><p>Captura los datos y genera el documento listo para imprimir o enviar.</p><div class="form"><div class="field"><label>Número<input id="num"></label></div><div class="field"><label>Fecha<input id="date" type="date"></label></div><div class="field full"><label>Cliente<input id="client" placeholder="Nombre del cliente"></label></div><div class="field"><label>WhatsApp<input id="phone"></label></div><div class="field"><label>Vigencia<input id="valid" value="7 días"></label></div><div class="field full"><label>Método de pago<input id="pay" value="Transferencia / Mercado Pago"></label></div></div><div class="items"><b>Servicios</b><div id="items"></div><button class="add" onclick="add()">+ Agregar servicio</button></div><div class="form" style="margin-top:12px"><div class="field"><label>Descuento (%)<input id="disc" type="number" value="0"></label></div><div class="field"><label>Pagado<input id="paid" type="number" value="0"></label></div><div class="field full"><label>Términos<textarea id="terms">Servicio de orientación y acompañamiento espiritual. Los resultados pueden variar según cada persona. El servicio no sustituye atención médica, psicológica, legal o financiera.</textarea></label></div></div><div class="acts"><button class="cancel" onclick="closeQ()">Cancelar</button><button class="save" onclick="make()">GENERAR PDF</button></div></div></div><div class="toast" id="toast"></div>
<script>
const $=x=>document.getElementById(x),M=n=>new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN"}).format(n||0);let docs=JSON.parse(localStorage.getItem("esotericDocs")||"[]");
function add(n="",q=1,p=0){let r=document.createElement("div");r.className="item";r.innerHTML='<input class="n" placeholder="Servicio" value="'+n+'"><input class="q" type="number" value="'+q+'"><input class="p" type="number" value="'+p+'"><button class="del" onclick="this.parentElement.remove()">×</button>';$("items").appendChild(r)}
function openQ(){$("modal").classList.add("show")}function closeQ(){$("modal").classList.remove("show")}
function render(){let t=docs.reduce((a,d)=>a+d.due,0);$("grand").textContent=M(t);$("due").textContent=M(t);$("list").innerHTML=docs.length?docs.slice(0,10).map(d=>'<div class="card" onclick=pdf('+encodeURIComponent(JSON.stringify(d))+')><div class="doc">▤</div><div class="info"><b>'+esc(d.client)+'</b><small>'+esc(d.num)+'</small></div><div class="money">'+M(d.total)+'<span class="badge">'+(d.due>0?"Vence hoy":"Pagada")+'</span></div></div>').join(""):'<div style="text-align:center;color:#888;padding:50px 10px">Aún no tienes cotizaciones.<br>Usa “CREAR COTIZACIÓN”.</div>'}
function make(){let items=[...document.querySelectorAll(".item")].map(r=>({name:r.querySelector(".n").value||"Servicio",q:+r.querySelector(".q").value||1,p:+r.querySelector(".p").value||0}));let sub=items.reduce((a,x)=>a+x.q*x.p,0),disc=sub*(+$("disc").value||0)/100,total=sub-disc,paid=+$("paid").value||0,d={num:$("num").value,client:$("client").value||"Cotización",date:$("date").value,valid:$("valid").value,total,paid,due:total-paid,items,phone:$("phone").value,pay:$("pay").value,terms:$("terms").value};docs.unshift(d);localStorage.setItem("esotericDocs",JSON.stringify(docs));closeQ();render();pdf(encodeURIComponent(JSON.stringify(d)))}
function pdf(enc){let d=typeof enc==="string"?JSON.parse(decodeURIComponent(enc)):enc,rows=d.items.map(x=>"<tr><td>"+esc(x.name)+"</td><td>"+x.q+"</td><td>"+M(x.p)+"</td><td>"+M(x.q*x.p)+"</td></tr>").join(""),h='<!doctype html><html><head><meta charset=utf-8><title>'+esc(d.num)+'</title><style>@page{size:A4;margin:12mm}body{font-family:Arial;color:#29212d}header{background:#4b176d;color:#fff;padding:25px}h1{margin:0;font-size:30px;letter-spacing:3px}.meta{float:right;text-align:right;font-size:12px}main{padding:25px}.client{background:#f5f1f7;padding:14px;margin-bottom:20px}table{width:100%;border-collapse:collapse}th{background:#eee7f1;color:#4b176d;text-align:left;padding:10px}td{padding:10px;border-bottom:1px solid #ddd}.tot{margin-left:auto;width:280px;margin-top:20px}.tot div{display:flex;justify-content:space-between;padding:6px}.grand{font-size:19px;font-weight:bold;border-top:2px solid #c9a24b;color:#4b176d}.terms{margin-top:30px;color:#777;font-size:10px}.foot{text-align:center;margin-top:35px;color:#777;font-size:10px}</style></head><body><header><div class=meta>COTIZACIÓN<br>'+esc(d.num)+'<br>'+esc(d.date)+'<br>Vigencia: '+esc(d.valid)+'</div><h1>ESOTERIC</h1><small>GUÍA Y CONSEJERO ESPIRITUAL</small></header><main><div class=client><b>CLIENTE</b><br>'+esc(d.client)+'<br>'+esc(d.phone||"")+'<br><br><b>MÉTODO DE PAGO</b><br>'+esc(d.pay)+'</div><table><tr><th>Servicio</th><th>Cant.</th><th>Precio</th><th>Importe</th></tr>'+rows+'</table><div class=tot><div>Subtotal <b>'+M(d.total)+'</b></div><div>Pagado <b>'+M(d.paid)+'</b></div><div class=grand>Total por pagar <b>'+M(d.due)+'</b></div></div><div class=terms><b>Términos y condiciones</b><br>'+esc(d.terms)+'</div><div class=foot>ventas@esoteric.com.mx · www.esoteric.com.mx<br>Gracias por su confianza</div></main><script>window.onload=()=>setTimeout(()=>window.print(),400)<\/script></body></html>';let w=window.open("","_blank");if(w){w.document.write(h);w.document.close()}else alert("Permite ventanas emergentes para generar el PDF")}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function init(){let d=new Date();$("month").textContent=d.toLocaleDateString("es-MX",{month:"long",year:"numeric"}).replace(/^./,x=>x.toUpperCase());$("date").value=d.toISOString().slice(0,10);$("num").value="FAC"+String(docs.length+1).padStart(4,"0");add();render()}init();
</script></body></html>
