<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESOTERIC · Acceso</title>
<meta name="theme-color" content="#0a0712">
<style>
:root{--bg:#090612;--panel:#151024;--gold:#d8b46a;--text:#f7f2e8;--muted:#b8aec9;--line:#35274e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#30204d 0,#100a1b 42%,#090612 80%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(100%,520px);background:linear-gradient(180deg,rgba(29,22,48,.98),rgba(16,11,28,.98));border:1px solid var(--line);border-radius:24px;padding:30px 22px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.logo{color:var(--gold);font-weight:900;letter-spacing:.22em;text-align:center;font-size:28px}
h1{font-family:Georgia,serif;font-weight:500;text-align:center;margin:10px 0 6px}
.intro{text-align:center;color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 24px}
.option{border:1px solid #47365f;border-radius:18px;padding:18px;margin-top:14px;background:#100b1b}
.option h2{margin:0 0 6px;font-family:Georgia,serif;font-weight:500}
.option p{margin:0 0 14px;color:var(--muted);font-size:13px}
form{display:grid;gap:10px}
input{width:100%;height:50px;border:1px solid #47365f;background:#0e0918;color:var(--text);border-radius:13px;padding:13px;font:inherit}
button,.primary{height:50px;border:0;border-radius:13px;background:var(--gold);color:#1a1024;font-weight:900;font-size:15px;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}
.secondary{height:50px;border:1px solid #6b537d;border-radius:13px;color:var(--gold);font-weight:900;text-decoration:none;display:flex;align-items:center;justify-content:center}
.msg{min-height:20px;text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
.back{display:block;text-align:center;margin-top:20px;color:var(--gold);text-decoration:none;font-size:13px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">ESOTERIC</div>
  <h1>Tu acceso</h1>
  <p class="intro">Elige cómo quieres continuar.</p>

  <section class="option">
    <h2>🔐 Iniciar sesión</h2>
    <p>Accede a tu cuenta y consulta tus beneficios.</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Correo electrónico" autocomplete="email" required>
      <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button type="submit" id="loginBtn">Entrar a ESOTERIC</button>
    </form>
    <div class="msg" id="msg"></div>
  </section>

  <section class="option">
    <h2>✨ Crear cuenta</h2>
    <p>Regístrate para acceder a las funciones disponibles para tu cuenta.</p>
    <a class="secondary" href="registro.html">Crear mi cuenta</a>
  </section>

  <a class="back" href="index.html">← Volver al Oráculo</a>
</main>
<script>
const API='https://esoteric-api.delangel-velasco.workers.dev';
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('loginBtn'),msg=document.getElementById('msg');
  btn.disabled=true;btn.textContent='Verificando…';msg.textContent='';
  try{
    const response=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({
      email:document.getElementById('email').value.trim(),
      password:document.getElementById('password').value
    })});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||'No se pudo iniciar sesión.');
    localStorage.setItem('esoteric_auth_token',data.token);
    window.location.href='index.html';
  }catch(err){
    msg.textContent='⚠️ '+err.message;
    btn.disabled=false;btn.textContent='Entrar a ESOTERIC';
  }
});
</script>
</body>
</html>
