<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESOTERIC · Crear cuenta</title>
<meta name="theme-color" content="#0a0712">
<style>
:root{--bg:#090612;--panel:#151024;--gold:#d8b46a;--text:#f7f2e8;--muted:#b8aec9;--line:#35274e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#30204d 0,#100a1b 42%,#090612 80%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.3;background-image:radial-gradient(circle at 15% 20%,rgba(216,180,106,.7) 0 1px,transparent 1.5px),radial-gradient(circle at 80% 12%,rgba(255,255,255,.55) 0 1px,transparent 1.5px);background-size:170px 190px,230px 220px}
.card{position:relative;width:min(100%,560px);background:linear-gradient(180deg,rgba(29,22,48,.97),rgba(16,11,28,.97));border:1px solid var(--line);border-radius:24px;padding:28px 22px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.logo{color:var(--gold);font-weight:900;letter-spacing:.22em;text-align:center;font-size:28px}
h1{font-family:Georgia,serif;font-weight:500;text-align:center;margin:10px 0 6px}
p{color:var(--muted);text-align:center;font-size:13px;line-height:1.5;margin:0 0 22px}
form{display:grid;gap:12px}
input{width:100%;height:52px;border:1px solid #47365f;background:#0e0918;color:var(--text);border-radius:14px;padding:14px;font:inherit}
input::placeholder{color:#756982}
button{height:52px;border:0;border-radius:14px;background:var(--gold);color:#1a1024;font-weight:900;font-size:16px;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
.msg{min-height:24px;margin-top:12px;text-align:center;color:var(--muted);font-size:13px}
.back{display:block;text-align:center;margin-top:18px;color:var(--gold);text-decoration:none;font-weight:700;font-size:13px}
.success{display:none;text-align:center}
.success h2{font-family:Georgia,serif;color:var(--gold);font-weight:500}
.success a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:12px 22px;border-radius:14px;background:var(--gold);color:#1a1024;text-decoration:none;font-weight:900}
</style>
</head>
<body>
<main class="card">
  <div class="logo">ESOTERIC</div>
  <h1>Crear tu cuenta</h1>
  <p>Regístrate para acceder a las tiradas y beneficios disponibles en tu cuenta ESOTERIC.</p>

  <form id="registerForm">
    <input id="registerName" type="text" placeholder="Nombre" autocomplete="name">
    <input id="registerEmail" type="email" placeholder="Correo electrónico" autocomplete="email" required>
    <input id="registerPassword" type="password" placeholder="Contraseña (mínimo 8 caracteres)" autocomplete="new-password" minlength="8" required>
    <button type="submit" id="registerBtn">✨ Crear mi cuenta</button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="success" id="success">
    <h2>✨ Cuenta creada</h2>
    <p>Tu cuenta fue creada correctamente. Ya puedes volver a ESOTERIC e iniciar sesión.</p>
    <a href="index.html#cuenta">🔐 Ir a iniciar sesión</a>
  </div>

  <a class="back" href="index.html">← Volver al Oráculo</a>
</main>

<script>
const API='https://esoteric-api.delangel-velasco.workers.dev';
document.getElementById('registerForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const form=e.currentTarget,btn=document.getElementById('registerBtn'),msg=document.getElementById('msg');
  btn.disabled=true;
  btn.textContent='Creando cuenta…';
  msg.textContent='';
  try{
    const response=await fetch(API+'/register',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({
        name:document.getElementById('registerName').value.trim(),
        email:document.getElementById('registerEmail').value.trim(),
        password:document.getElementById('registerPassword').value
      })
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(data.error||'No se pudo crear la cuenta.');
    form.style.display='none';
    msg.textContent='';
    document.getElementById('success').style.display='block';
  }catch(err){
    msg.textContent='⚠️ '+err.message;
    btn.disabled=false;
    btn.textContent='✨ Crear mi cuenta';
  }
});
</script>
</body>
</html>
