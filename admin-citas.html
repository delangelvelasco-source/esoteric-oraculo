<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESOTERIC · Gestión de citas</title>
<meta name="theme-color" content="#090612">
<style>
:root{--bg:#090612;--panel:#151024;--gold:#d8b46a;--text:#f7f2e8;--muted:#b8aec9;--line:#35274e;--green:#79d6a3;--red:#e98585;--blue:#8fb8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#30204d 0,#100a1b 42%,#090612 80%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.wrap{width:min(1180px,100%);margin:auto;padding:24px 16px 50px}.brand{text-align:center;color:var(--gold);letter-spacing:.22em;font-weight:800;font-size:30px}.sub{text-align:center;color:var(--muted);margin:6px 0 24px}
.panel{background:linear-gradient(145deg,rgba(30,21,49,.96),rgba(12,8,23,.98));border:1px solid rgba(216,180,106,.22);border-radius:22px;padding:18px;box-shadow:0 22px 60px rgba(0,0,0,.4);margin-bottom:16px}
.login{max-width:430px;margin:10vh auto 0}.login h1{font-family:Georgia,serif;font-weight:500;text-align:center;margin:6px 0 8px}.login p{text-align:center;color:var(--muted)}
label{display:block;color:var(--gold);font-weight:700;margin:14px 0 7px}input,select,button{font:inherit}input,select{width:100%;height:48px;padding:0 13px;border-radius:13px;border:1px solid #47365f;background:#0e0918;color:var(--text)}button{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{width:100%;margin-top:16px;background:var(--gold);color:#1a1024}.danger{background:rgba(233,133,133,.14);color:var(--red);border:1px solid rgba(233,133,133,.25)}.ok{background:rgba(121,214,163,.13);color:var(--green);border:1px solid rgba(121,214,163,.25)}.neutral{background:#2a203b;color:var(--text)}.msg{text-align:center;min-height:22px;color:var(--muted);margin-top:12px}
.hidden{display:none!important}.top{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.top h1{font-family:Georgia,serif;font-weight:500;margin:0}.top .user{color:var(--muted);font-size:13px}.filters{display:grid;grid-template-columns:1.2fr 1fr auto;gap:10px;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat{padding:14px;border:1px solid rgba(216,180,106,.15);border-radius:16px;background:rgba(8,5,16,.5)}.stat b{display:block;font-size:25px;color:var(--gold)}.stat span{color:var(--muted);font-size:12px}
.table-wrap{overflow:auto;border:1px solid rgba(216,180,106,.12);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:11px 10px;text-align:left;border-bottom:1px solid rgba(216,180,106,.1);font-size:13px}th{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.06em;background:rgba(8,5,16,.5)}td{color:#eee8f2}.folio{font-weight:800;color:var(--gold);letter-spacing:.04em}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.pending{background:rgba(216,180,106,.14);color:var(--gold)}.confirmed{background:rgba(121,214,163,.13);color:var(--green)}.cancelled{background:rgba(233,133,133,.12);color:var(--red)}.completed{background:rgba(143,184,255,.12);color:var(--blue)}.rescheduled{background:rgba(170,137,220,.13);color:#c5a9eb}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 9px;font-size:11px}
.empty{text-align:center;color:var(--muted);padding:35px}.note{color:var(--muted);font-size:12px;margin-top:10px}
@media(max-width:700px){.wrap{padding:16px 10px 35px}.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}.top h1{font-size:22px}}
</style>
</head>
<body>
<div id="loginView" class="wrap">
  <div class="panel login">
    <div class="brand">ESOTERIC</div>
    <h1>Gestión de citas</h1>
    <p>Área privada · acceso exclusivo para administración</p>
    <form id="loginForm">
      <label for="email">Correo</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">🔐 Entrar al administrador</button>
    </form>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<div id="appView" class="wrap hidden">
  <div class="panel">
    <div class="top">
      <div><div class="brand" style="text-align:left;font-size:22px">ESOTERIC</div><h1>📅 Administración de citas</h1><div id="userInfo" class="user"></div></div>
      <button id="logout" class="neutral">Cerrar sesión</button>
    </div>
    <div class="filters">
      <input id="dateFilter" type="date">
      <select id="statusFilter">
        <option value="">Todos los estados</option>
        <option value="pending">Pendientes</option>
        <option value="confirmed">Confirmadas</option>
        <option value="rescheduled">Reprogramadas</option>
        <option value="completed">Finalizadas</option>
        <option value="cancelled">Canceladas</option>
      </select>
      <button id="refresh" class="ok">↻ Actualizar</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="countTotal">0</b><span>Total visibles</span></div>
      <div class="stat"><b id="countPending">0</b><span>Pendientes</span></div>
      <div class="stat"><b id="countConfirmed">0</b><span>Confirmadas</span></div>
      <div class="stat"><b id="countToday">0</b><span>Hoy</span></div>
    </div>
  </div>

  <div class="panel">
    <div class="top"><h1 style="font-size:20px">Citas</h1><span class="user">Actualización manual · D1</span></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Folio</th><th>Fecha</th><th>Hora</th><th>Cliente</th><th>WhatsApp</th><th>Servicio</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="empty" class="empty hidden">No hay citas con los filtros seleccionados.</div>
    <div id="appMsg" class="note"></div>
  </div>
</div>

<script>
const API='https://esoteric-citas.delangel-velasco.workers.dev';
const TOKEN_KEY='esoteric_auth_token';
const token=()=>localStorage.getItem(TOKEN_KEY)||'';
async function api(path,options={}){
  const headers={Accept:'application/json',...(options.headers||{})};
  const t=token(); if(t) headers.Authorization='Bearer '+t;
  const r=await fetch(API+path,{...options,headers});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||'Error '+r.status);
  return d;
}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Date().toISOString().slice(0,10);
function statusLabel(s){return ({pending:'Pendiente',confirmed:'Confirmada',rescheduled:'Reprogramada',completed:'Finalizada',cancelled:'Cancelada'}[s]||s)}
function wa(phone,folio,date,time){const p=String(phone||'').replace(/\D/g,'');if(!p)return '#';return 'https://wa.me/'+p+'?text='+encodeURIComponent('Hola, ESOTERIC. Tu cita '+folio+' está programada para '+date+' a las '+time+'.')}
async function verify(){
  if(!token())return showLogin();
  try{
    const d=await api('/me');
    if(!d.authenticated||d.user.role!=='admin')throw new Error('Esta cuenta no tiene permisos de administrador.');
    document.getElementById('userInfo').textContent=d.user.name+' · '+d.user.email;
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('appView').classList.remove('hidden');
    document.getElementById('dateFilter').value=today();
    load();
  }catch(e){localStorage.removeItem(TOKEN_KEY);showLogin(e.message)}
}
function showLogin(msg=''){document.getElementById('loginView').classList.remove('hidden');document.getElementById('appView').classList.add('hidden');document.getElementById('loginMsg').textContent=msg}
async function load(){
  const date=document.getElementById('dateFilter').value;
  const status=document.getElementById('statusFilter').value;
  const q=new URLSearchParams(); if(date)q.set('date',date); if(status)q.set('status',status);
  try{
    const d=await api('/admin/appointments?'+q.toString());
    render(d.appointments||[]);
    document.getElementById('appMsg').textContent='Última actualización: '+new Date().toLocaleTimeString('es-MX');
  }catch(e){document.getElementById('appMsg').textContent='⚠️ '+e.message;if(e.message.includes('Sesión')||e.message.includes('administrativo'))showLogin(e.message)}
}
function render(list){
  const rows=document.getElementById('rows');rows.innerHTML='';
  const pending=list.filter(x=>x.status==='pending').length,confirmed=list.filter(x=>x.status==='confirmed').length,todayCount=list.filter(x=>x.appointment_date===today()).length;
  document.getElementById('countTotal').textContent=list.length;document.getElementById('countPending').textContent=pending;document.getElementById('countConfirmed').textContent=confirmed;document.getElementById('countToday').textContent=todayCount;
  document.getElementById('empty').classList.toggle('hidden',!!list.length);
  list.forEach(a=>{
    const tr=document.createElement('tr');
    const phone=String(a.client_phone||'').replace(/\D/g,'');
    tr.innerHTML='<td class="folio">'+esc(a.folio)+'</td><td>'+esc(a.appointment_date)+'</td><td>'+esc(a.appointment_time)+'</td><td>'+esc(a.client_name)+'</td><td>'+(phone?'<a href="'+wa(phone,a.folio,a.appointment_date,a.appointment_time)+'" target="_blank" rel="noopener">💬 '+esc(a.client_phone)+'</a>':'—')+'</td><td>'+esc(a.service)+'</td><td><span class="badge '+esc(a.status)+'">'+esc(statusLabel(a.status))+'</span></td><td><div class="actions">'+(a.status==='pending'?'<button class="ok" data-action="confirm">Confirmar</button>':'')+(a.status!=='cancelled'&&a.status!=='completed'?'<button class="neutral" data-action="reschedule">Reprogramar</button>':'')+(a.status!=='cancelled'&&a.status!=='completed'?'<button class="danger" data-action="cancel">Cancelar</button>':'')+(a.status==='confirmed'||a.status==='rescheduled'?'<button class="ok" data-action="complete">Finalizar</button>':'')+'</div></td>';
    tr.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(a,b.dataset.action));
    rows.appendChild(tr);
  });
}
async function action(a,action){
  let body={id:a.id,action};
  if(action==='reschedule'){
    const d=prompt('Nueva fecha (AAAA-MM-DD):',a.appointment_date);if(!d)return;
    const t=prompt('Nueva hora (HH:MM):',a.appointment_time);if(!t)return;
    body.date=d;body.time=t;
  }
  if(action==='cancel'&&!confirm('¿Cancelar la cita '+a.folio+'?'))return;
  try{await api('/admin/appointments',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});load()}catch(e){alert('⚠️ '+e.message)}
}
document.getElementById('loginForm').onsubmit=async e=>{
  e.preventDefault();const m=document.getElementById('loginMsg');m.textContent='Verificando…';
  try{
    const d=await api('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});
    localStorage.setItem(TOKEN_KEY,d.token);verify();
  }catch(e){m.textContent='⚠️ '+e.message}
};
document.getElementById('logout').onclick=async()=>{try{await api('/logout',{method:'POST'})}catch(e){}localStorage.removeItem(TOKEN_KEY);showLogin()};
document.getElementById('refresh').onclick=load;
document.getElementById('dateFilter').onchange=load;
document.getElementById('statusFilter').onchange=load;
verify();
</script>
</body>
</html>
